[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "xiaomi_flashable_firmware_creator"
version = "2.2.15"
description = "Create flashable firmware zips from Xiaomi, Redmi, and POCO ROMs"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "GPL-3.0-or-later"}
dependencies = [
    "protobuf>=4.22.1,<6.0.0",
    "remotezip>=0.12.3",
]

[project.scripts]
xiaomi_flashable_firmware_creator = "xiaomi_flashable_firmware_creator.xiaomi_flashable_firmware_creator:main"

[tool.setuptools.packages.find]
include = ["xiaomi_flashable_firmware_creator*"]

[tool.setuptools.package-data]
xiaomi_flashable_firmware_creator = [
    "binaries/*",
    "templates/*",
]
